[manager]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1200
max_height = 900
cache_dir = ""
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', block = true },
]
open = [
  { run = 'xdg-open "$@"' },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"' },
]
extract = [
  { run = 'unar "$1"', desc = "Extract here" },
]
drag = [
  { run = 'ripdrag "$@"', desc = "Drag and drop" },
]

[open]
rules = [
  { name = "*/", use = ["edit", "open", "reveal", "drag"] },
  { mime = "text/*", use = ["edit", "open", "drag"] },
  { mime = "image/*", use = ["open", "drag"] },
  { mime = "video/*", use = ["open", "drag"] },
  { mime = "audio/*", use = ["open", "drag"] },
  { mime = "application/json", use = ["edit", "open", "drag"] },
  { mime = "application/zip", use = ["extract", "open", "drag"] },
  { mime = "application/gzip", use = ["extract", "open", "drag"] },
  { mime = "application/x-tar", use = ["extract", "open", "drag"] },
  { mime = "*", use = ["open", "edit", "reveal", "drag"] },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
suppress_preload = false

[log]
enabled = false

# CSV / TSV / JSON / Parquet
[[plugin.prepend_previewers]]
name = "*.csv"
run  = "duckdb"

[[plugin.prepend_previewers]]
name = "*.tsv"
run  = "duckdb"

[[plugin.prepend_previewers]]
name = "*.parquet"
run  = "duckdb"

[[plugin.prepend_previewers]]
mime = "application/json"
run  = "duckdb"

# Media
[[plugin.prepend_previewers]]
mime = "video/*"
run  = "mediainfo"

[[plugin.prepend_previewers]]
mime = "audio/*"
run  = "mediainfo"

# Archives
[[plugin.prepend_previewers]]
mime = "application/zip"
run  = "ouch"

[[plugin.prepend_previewers]]
mime = "application/x-tar"
run  = "ouch"

[[plugin.prepend_previewers]]
mime = "application/gzip"
run  = "ouch"

[[plugin.prepend_previewers]]
mime = "application/x-bzip2"
run  = "ouch"

[[plugin.prepend_previewers]]
mime = "application/x-xz"
run  = "ouch"

[[plugin.prepend_previewers]]
mime = "application/zstd"
run  = "ouch"

# Markdown
[[plugin.prepend_previewers]]
name = "*.md"
run  = "piper"
args = ["CLICOLOR_FORCE=1 glow -w=$w -s=dark \"$1\""]

# Office docs
[[plugin.prepend_previewers]]
name = "*.docx"
run  = "piper"
args = ["pandoc -t plain \"$1\" | bat --language=text --color=always --paging=never"]

[[plugin.prepend_previewers]]
name = "*.odt"
run  = "piper"
args = ["pandoc -t plain \"$1\" | bat --language=text --color=always --paging=never"]

[[plugin.prepend_previewers]]
name = "*.rtf"
run  = "piper"
args = ["pandoc -t plain \"$1\" | bat --language=text --color=always --paging=never"]

# PDF
[[plugin.prepend_previewers]]
mime = "application/pdf"
run  = "piper"
args = ["pdftoppm -r 150 -singlefile \"$1\" /tmp/yazi_pdf && chafa --format=kitty --size=${w}x${h} /tmp/yazi_pdf.ppm"]

# Code / text
[[plugin.prepend_previewers]]
mime = "text/*"
run  = "piper"
args = ["bat --color=always --paging=never --wrap=never \"$1\""]

# Binary fallback
[[plugin.prepend_previewers]]
mime = "application/octet-stream"
run  = "piper"
args = ["hexyl --border=none \"$1\""]

[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
run = "git"
